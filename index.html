<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para você, Momo ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars" aria-hidden="true"></div>

    <section class="intro" id="intro">
      <p class="hint">Tem uma coisinha aqui para você... 💗</p>

      <button class="heart-button" id="heartButton" aria-label="Abrir coração">
        <span class="heart heart-left">❤</span>
        <span class="heart heart-right">❤</span>
        <span class="sparkle sparkle-1">✦</span>
        <span class="sparkle sparkle-2">✧</span>
        <span class="sparkle sparkle-3">✦</span>
      </button>
    </section>

    <section class="letter hidden" id="letter">
      <div class="card">
        <div class="card-heart">♥</div>
        <div class="message" id="message"></div>
        <div class="cursor" id="cursor"></div>
        <button class="again hidden" id="again">ler de novo 💌</button>
        <button class="close-letter" id="closeLetter" aria-label="Fechar cartinha">×</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
